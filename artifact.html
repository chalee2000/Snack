<title>Block Blast</title>
<link rel="stylesheet" href="style.css" />

<div id="game">
  <header>
    <h1>Block Blast</h1>
    <div id="scoreboard">
      <div class="score-box">
        <span>Score</span>
        <strong id="score">0</strong>
      </div>
      <div class="score-box">
        <span>Best</span>
        <strong id="best">0</strong>
      </div>
    </div>
  </header>

  <div id="board"></div>

  <div id="tray">
    <div class="tray-slot" data-slot="0"></div>
    <div class="tray-slot" data-slot="1"></div>
    <div class="tray-slot" data-slot="2"></div>
  </div>

  <button id="newGameBtn">New Game</button>
</div>

<div id="gameOverOverlay" class="hidden">
  <div class="gameover-card">
    <h2>Game Over</h2>
    <p>Score: <strong id="finalScore">0</strong></p>
    <p id="newBestMsg" class="hidden">New Best!</p>
    <button id="restartBtn">Play Again</button>
  </div>
</div>

<div id="dragLayer"></div>

<script src="script.js"></script>
