<!doctype html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Block Blast</title>
<meta name="theme-color" content="#14162b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Block Blast" />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="icon.svg" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game">
    <header>
      <h1>Block Blast</h1>
      <div id="scoreboard">
        <div class="score-box">
          <span>Score</span>
          <strong id="score">0</strong>
        </div>
        <div class="score-box">
          <span>Best</span>
          <strong id="best">0</strong>
        </div>
      </div>
    </header>

    <div id="board"></div>

    <div id="tray">
      <div class="tray-slot" data-slot="0"></div>
      <div class="tray-slot" data-slot="1"></div>
      <div class="tray-slot" data-slot="2"></div>
    </div>

    <button id="newGameBtn">New Game</button>
  </div>

  <div id="gameOverOverlay" class="hidden">
    <div class="gameover-card">
      <h2>Game Over</h2>
      <p>Score: <strong id="finalScore">0</strong></p>
      <p id="newBestMsg" class="hidden">New Best!</p>
      <button id="restartBtn">Play Again</button>
    </div>
  </div>

  <div id="dragLayer"></div>

  <script src="script.js"></script>
</body>
</html>
